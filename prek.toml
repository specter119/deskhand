# Native prek configuration for deskhand.
# Hook repositories are pinned so maintenance changes remain reviewable.
minimum_prek_version = "0.5.10"

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=512"]

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"
priority = 2

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
priority = 2

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.4"

[[repos.hooks]]
id = "ruff-check"
require_serial = true

[[repos.hooks]]
id = "ruff-format"
require_serial = true

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "0.26"

[[repos.hooks]]
id = "validate-pyproject"

[[repos]]
repo = "local"

# bridge.ps1 is shipped as UTF-8 and sent to Windows PowerShell 5.1 as text, so it must parse there,
# stay ASCII, and never exit the resident worker. Those three rules are already pinned by this test;
# running it cannot drift from them the way a re-implementation in a hook would.
[[repos.hooks]]
id = "bridge-script-rules"
name = "bridge.ps1: parses in Windows PowerShell 5.1, ASCII only, never exits"
language = "system"
entry = "uv run pytest tests/unit/test_bridge_script.py -q"
files = "\\.ps1$"
pass_filenames = false
require_serial = true

# Changing a tool schema without regenerating the advertised contract is the drift a reader cannot
# see in the diff.
[[repos.hooks]]
id = "advertised-tools-are-current"
name = "fixtures/tools.json matches the advertised tools"
language = "system"
entry = "bash -c 'uv run python tests/parity/dump_tools.py || exit 1; git diff --exit-code -- tests/parity/fixtures/tools.json || { echo \"fixtures/tools.json was regenerated; review and stage it\"; exit 1; }'"
files = "^(src/deskhand/onenote/(schemas|tools|server)\\.py|tests/parity/dump_tools\\.py)$"
pass_filenames = false
require_serial = true

# The repository AGENTS.md keeps uv.lock out of the tree: it records the local package index URL.
[[repos.hooks]]
id = "no-uv-lock"
name = "uv.lock must not be committed"
language = "system"
entry = "bash -c 'echo \"uv.lock records the local package index URL; keep it out of the commit\"; exit 1'"
files = "^uv\\.lock$"
pass_filenames = false

# Slow checks: they need the whole tree, not the staged files, so they run before a push.
[[repos.hooks]]
id = "pyright"
name = "pyright"
language = "system"
entry = "uv run pyright"
files = "\\.py$"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "unit-tests"
name = "unit tests"
language = "system"
entry = "uv run pytest -q"
files = "^(src|tests)/.*\\.py$"
pass_filenames = false
stages = ["pre-push"]
